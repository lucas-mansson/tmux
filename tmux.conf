# Change prefix to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# MOUSE 
# Enable mouse support for selecting windows, resizing panes, scrolling
set-option -g mouse on

# PANE SPLITTING
# Easier splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# --- PANE NAVIGATION ---
# Use vim-like keys for moving between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- WINDOW MANAGEMENT ---
# Switch windows with prefix + number (default)
# Rename windows easily
bind , command-prompt "rename-window %%"
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# --- STATUS BAR ---
# Simple status bar colors and time
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set-option -g status-bg colour235
set-option -g status-fg colour136
set-option -g status-left " #S "          # Show session name
set-option -g status-right "%Y-%m-%d %H:%M" # Date & time

# --- RELOAD CONFIG ---
# Reload config easily
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

set -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @tpm_plugins_path '~/.config/tmux/plugins/'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
